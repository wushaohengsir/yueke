# 隐藏 nginx 版本号（纵深：不暴露软件版本信息）
server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 自签 TLS（含 SAN=公网 IP）：登录/Token 不再明文传输；正式域名后可换 CA 证书
    ssl_certificate     /etc/nginx/certs/bookmate.crt;
    ssl_certificate_key /etc/nginx/certs/bookmate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 安全响应头：防嗅探/点击劫持/信息泄露，CSP 收紧可加载源
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # /api 反代到后端容器（同源，避免跨域；后端自身路由带 /api 前缀）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
